[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenhouse-backend"
version = "0.1.0"
description = "Smart greenhouse API — Phase 1 skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "scalar-fastapi>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

# Installing the project (editable or not) puts `src` on sys.path, so
# `python -m uvicorn src.main:app` and `pytest` work from any directory.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Without this, the local alembic/ directory makes ruff treat the installed
# alembic package as first-party and reorder env.py's imports.
known-first-party = ["src"]
known-third-party = ["alembic"]
